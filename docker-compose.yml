version: '3.8'

# Note: PostgreSQL is running on external server 192.168.9.227:5439
# This compose file is for reference if you want to run services in containers

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pa-backend
    environment:
      - POSTGRES_DSN=postgresql://postgres:password$1@192.168.9.227:5439/sultan_assistant
      - LLM_GATEWAY_URL=http://host.docker.internal:4000
      - LLM_GATEWAY_KEY=test123
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    ports:
      - "8000:8000"
    networks:
      - pa-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL_API=http://localhost:8000
        - NEXT_PUBLIC_WS_BASE_URL=ws://localhost:8000/ws
    container_name: pa-frontend
    environment:
      - NEXTAUTH_URL=http://localhost:3000/api/auth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pa-network

networks:
  pa-network:
    driver: bridge
